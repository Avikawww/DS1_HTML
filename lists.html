<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

<h2>Ordered List</h2>

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>

<h2>Unordered List</h2>

<ul>
    <li>Computer Science</li>
    <li>Data Science</li>
    <li>Artificial Intelligence</li>
</ul>

<h2>Description List</h2>

<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
</dl>

</body>
</html>
