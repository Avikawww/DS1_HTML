<!DOCTYPE html>
<html>
<head>
    <title>CSS Example</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: black;
            font-size: 18px;
        }
    </style>
</head>
<body>

<h1>Welcome to HTML</h1>

<p>
    CSS is used to style HTML elements.
</p>

<p>
    It changes colors, fonts and layout.
</p>

</body>
</html>
